name: Neutral Wall Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "Rapfi/**"
      - ".github/workflows/wall-smoke-test.yml"

jobs:
  wall-test:
    runs-on: ubuntu-22.04

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Rapfi
        run: |
          cmake -S Rapfi -B Rapfi/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNO_COMMAND_MODULES=ON \
            -DFORCE_ASSERTION=ON \
            -DUSE_AVX512=OFF \
            -DUSE_BMI2=OFF \
            -DUSE_VNNI=OFF

      - name: Build Rapfi
        run: |
          cmake --build Rapfi/build -j2

      - name: Test internal walls
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="./Rapfi/build/pbrain-rapfi"

          cat > /tmp/wall-test.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          3,3,3
          10,10,3
          6,7,1
          8,8,2
          DONE
          TRACEBOARD
          TRACESEARCH
          END
          EOF

          # Do NOT let set -e hide engine output.
          set +e

          "$ENGINE" \
            < /tmp/wall-test.txt \
            > /tmp/wall-output.txt 2>&1

          ENGINE_EXIT=$?

          set -e

          echo "================================"
          echo "Rapfi output"
          echo "================================"

          cat /tmp/wall-output.txt

          echo "================================"
          echo "Rapfi exit code: $ENGINE_EXIT"
          echo "================================"

          if [ "$ENGINE_EXIT" -ne 0 ]; then
            echo "ERROR: Rapfi crashed or returned an error."
            exit "$ENGINE_EXIT"
          fi

          echo "=== Checking WALL rendering ==="

          if ! grep -q "#" /tmp/wall-output.txt; then
            echo "ERROR: TRACEBOARD did not contain WALL markers (#)"
            exit 1
          fi

          echo "PASS: WALL markers exist"

          echo "=== Checking legal moves ==="

          LEGAL_LINE=$(
            grep "Legal Moves" \
              /tmp/wall-output.txt \
              | tail -1 \
              || true
          )

          echo "$LEGAL_LINE"

          if [ -z "$LEGAL_LINE" ]; then
            echo "ERROR: TRACESEARCH did not produce Legal Moves"
            exit 1
          fi

          if echo "$LEGAL_LINE" | grep -qw "H8"; then
            echo "ERROR: WALL H8 appeared as legal"
            exit 1
          fi

          if echo "$LEGAL_LINE" | grep -qw "D4"; then
            echo "ERROR: WALL D4 appeared as legal"
            exit 1
          fi

          if echo "$LEGAL_LINE" | grep -qw "K11"; then
            echo "ERROR: WALL K11 appeared as legal"
            exit 1
          fi

          echo "PASS: WALL cells are not legal moves"

          if ! grep -q "Static Eval\\[Black\\]" \
            /tmp/wall-output.txt; then

            echo "ERROR: TRACESEARCH did not finish static evaluation"
            exit 1
          fi

          echo "PASS: static evaluation completed"
      - name: Test wall cuts line pattern
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="./Rapfi/build/pbrain-rapfi"

          cat > /tmp/wall-cut-test.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          4,7,1
          5,7,1
          6,7,1
          8,7,1
          9,7,1
          DONE
          TRACEBOARD
          END
          EOF

          "$ENGINE" \
            < /tmp/wall-cut-test.txt \
            > /tmp/wall-cut-output.txt 2>&1

          cat /tmp/wall-cut-output.txt

          echo "=== Checking WALL cuts black line pattern ==="

          if ! grep -q "LastP4\[Black\]\[A\]: None" \
            /tmp/wall-cut-output.txt; then

            echo "ERROR: Stones across WALL created a false A_FIVE pattern"
            exit 1
          fi

          echo "PASS: WALL cuts the line pattern"
      - name: Test wall cuts vertical line
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="./Rapfi/build/pbrain-rapfi"

          cat > /tmp/wall-vertical-test.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          7,4,1
          7,5,1
          7,6,1
          7,8,1
          7,9,1
          DONE
          TRACEBOARD
          END
          EOF

          "$ENGINE" \
            < /tmp/wall-vertical-test.txt \
            > /tmp/wall-vertical-output.txt 2>&1

          cat /tmp/wall-vertical-output.txt

          if ! grep -q "LastP4\[Black\]\[A\]: None" \
            /tmp/wall-vertical-output.txt; then

            echo "ERROR: Vertical stones across WALL created a false A_FIVE pattern"
            exit 1
          fi

          echo "PASS: WALL cuts vertical line pattern"
      - name: Test wall cuts diagonal line
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="./Rapfi/build/pbrain-rapfi"

          cat > /tmp/wall-diagonal-test.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          4,4,1
          5,5,1
          6,6,1
          8,8,1
          9,9,1
          DONE
          TRACEBOARD
          END
          EOF

          "$ENGINE" \
            < /tmp/wall-diagonal-test.txt \
            > /tmp/wall-diagonal-output.txt 2>&1

          cat /tmp/wall-diagonal-output.txt

          if ! grep -q "LastP4\[Black\]\[A\]: None" \
            /tmp/wall-diagonal-output.txt; then

            echo "ERROR: Diagonal stones across WALL created a false A_FIVE pattern"
            exit 1
          fi

          echo "PASS: WALL cuts diagonal line pattern"
      - name: Test wall cuts anti-diagonal line
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="./Rapfi/build/pbrain-rapfi"

          cat > /tmp/wall-antidiagonal-test.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          4,10,1
          5,9,1
          6,8,1
          8,6,1
          9,5,1
          DONE
          TRACEBOARD
          END
          EOF

          "$ENGINE" \
            < /tmp/wall-antidiagonal-test.txt \
            > /tmp/wall-antidiagonal-output.txt 2>&1

          cat /tmp/wall-antidiagonal-output.txt

          if ! grep -q "LastP4\[Black\]\[A\]: None" \
            /tmp/wall-antidiagonal-output.txt; then

            echo "ERROR: Anti-diagonal stones across WALL created a false A_FIVE pattern"
            exit 1
          fi

          echo "PASS: WALL cuts anti-diagonal line pattern"


      - name: Test walls do not consume turns
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="./Rapfi/build/pbrain-rapfi"

          cat > /tmp/wall-turn-test.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          3,3,3
          10,10,3
          DONE
          TRACEBOARD
          END
          EOF

          "$ENGINE" \
            < /tmp/wall-turn-test.txt \
            > /tmp/wall-turn-output.txt 2>&1

          cat /tmp/wall-turn-output.txt

          if ! grep -q "Ply: 0" /tmp/wall-turn-output.txt; then
            echo "ERROR: WALLs incorrectly consumed ply"
            exit 1
          fi

          if ! grep -q "NonPassCount: 0" /tmp/wall-turn-output.txt; then
            echo "ERROR: WALLs incorrectly counted as moves"
            exit 1
          fi

          if ! grep -q "SideToMove: Black" /tmp/wall-turn-output.txt; then
            echo "ERROR: Black is not first after WALL setup"
            exit 1
          fi

          echo "PASS: WALLs do not consume turns and Black moves first"


      - name: Test stone cannot overlap wall
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="./Rapfi/build/pbrain-rapfi"

          cat > /tmp/wall-overlap-test.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          3,3,3
          10,10,3
          7,7,1
          DONE
          TRACEBOARD
          END
          EOF

          "$ENGINE" \
            < /tmp/wall-overlap-test.txt \
            > /tmp/wall-overlap-output.txt 2>&1 || true

          cat /tmp/wall-overlap-output.txt

          if ! grep -q "Stone position overlaps a wall or occupied cell" \
            /tmp/wall-overlap-output.txt; then

            echo "ERROR: Stone was allowed to overlap WALL"
            exit 1
          fi

          echo "PASS: Stone cannot overlap WALL"


      - name: Test wall cuts white line
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="./Rapfi/build/pbrain-rapfi"

          cat > /tmp/wall-white-test.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          0,0,1
          4,7,2
          5,7,2
          6,7,2
          8,7,2
          9,7,2
          DONE
          TRACEBOARD
          END
          EOF

          "$ENGINE" \
            < /tmp/wall-white-test.txt \
            > /tmp/wall-white-output.txt 2>&1

          cat /tmp/wall-white-output.txt

          if ! grep -q "LastP4\[White\]\[A\]: None" \
            /tmp/wall-white-output.txt; then

            echo "ERROR: White stones across WALL created a false A_FIVE pattern"
            exit 1
          fi

          echo "PASS: WALL cuts White line pattern"
      - name: Test Neutral opening rules
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="./Rapfi/build/pbrain-rapfi"

          echo "=== X1 rule ==="

          cat > /tmp/x1-rule.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          3,3,3
          10,10,3
          DONE
          TRACESEARCH
          END
          EOF

          "$ENGINE" \
            < /tmp/x1-rule.txt \
            > /tmp/x1-rule.out 2>&1

          X1_LINE=$(
            grep "Legal Moves" \
              /tmp/x1-rule.out \
              | tail -1 \
              || true
          )

          echo "$X1_LINE"

          if ! echo "$X1_LINE" | grep -qw "G7"; then
            echo "ERROR: legal adjacent X1 missing"
            exit 1
          fi

          if echo "$X1_LINE" | grep -qw "A1"; then
            echo "ERROR: far X1 was incorrectly legal"
            exit 1
          fi


          echo "=== X2 rule ==="

          cat > /tmp/x2-rule.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          3,3,3
          10,10,3
          6,7,1
          0,0,2
          DONE
          TRACESEARCH
          END
          EOF

          "$ENGINE" \
            < /tmp/x2-rule.txt \
            > /tmp/x2-rule.out 2>&1

          X2_LINE=$(
            grep "Legal Moves" \
              /tmp/x2-rule.out \
              | tail -1 \
              || true
          )

          echo "$X2_LINE"

          # X1 = G8.
          # C8 is distance 4 -> legal.
          if ! echo "$X2_LINE" | grep -qw "C8"; then
            echo "ERROR: distance-4 X2 missing"
            exit 1
          fi

          # D8 is distance 3 -> illegal.
          if echo "$X2_LINE" | grep -qw "D8"; then
            echo "ERROR: distance-3 X2 was legal"
            exit 1
          fi


          echo "=== X3 returns to normal ==="

          cat > /tmp/x3-rule.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          3,3,3
          10,10,3
          6,7,1
          0,0,2
          2,7,1
          14,14,2
          DONE
          TRACESEARCH
          END
          EOF

          "$ENGINE" \
            < /tmp/x3-rule.txt \
            > /tmp/x3-rule.out 2>&1

          X3_LINE=$(
            grep "Legal Moves" \
              /tmp/x3-rule.out \
              | tail -1 \
              || true
          )

          echo "$X3_LINE"

          if ! echo "$X3_LINE" | grep -qw "D8"; then
            echo "ERROR: X3 is still using X2 restriction"
            exit 1
          fi


          echo "=== Real engine X1 ==="

          cat > /tmp/x1-think.txt <<'EOF'
          START 15
          INFO timeout_turn 50
          BOARD
          7,7,3
          3,3,3
          10,10,3
          DONE
          END
          EOF

          "$ENGINE" \
            < /tmp/x1-think.txt \
            > /tmp/x1-think.out 2>&1

          cat /tmp/x1-think.out

          MOVE=$(
            grep -E '^[0-9]+,[0-9]+$' \
              /tmp/x1-think.out \
              | tail -1 \
              || true
          )

          if [ -z "$MOVE" ]; then
            echo "ERROR: engine produced no X1"
            exit 1
          fi

          X=${MOVE%,*}
          Y=${MOVE#*,}

          ADJ=0

          for WALL in "7 7" "3 3" "10 10"; do
            set -- $WALL

            WX=$1
            WY=$2

            DX=$((X-WX))
            DY=$((Y-WY))

            [ $DX -lt 0 ] && DX=$((-DX))
            [ $DY -lt 0 ] && DY=$((-DY))

            if [ $DX -le 1 ] \
              && [ $DY -le 1 ] \
              && { [ $DX -ne 0 ] || [ $DY -ne 0 ]; }; then
              ADJ=1
            fi
          done

          if [ "$ADJ" -ne 1 ]; then
            echo "ERROR: engine X1 is not adjacent to Neutral: $MOVE"
            exit 1
          fi


          echo "=== O1 free + real engine X2 ==="

          cat > /tmp/o1-free.txt <<'EOF'
          START 15
          INFO timeout_turn 50
          YXBOARD
          7,7,3
          3,3,3
          10,10,3
          6,7,1
          DONE
          TURN 14,14
          END
          EOF

          "$ENGINE" \
            < /tmp/o1-free.txt \
            > /tmp/o1-free.out 2>&1

          cat /tmp/o1-free.out

          if grep -q "Coord is not valid or empty" \
            /tmp/o1-free.out; then

            echo "ERROR: O1 was incorrectly restricted"
            exit 1
          fi

          MOVE=$(
            grep -E '^[0-9]+,[0-9]+$' \
              /tmp/o1-free.out \
              | tail -1 \
              || true
          )

          if [ -z "$MOVE" ]; then
            echo "ERROR: engine produced no X2"
            exit 1
          fi

          X=${MOVE%,*}
          Y=${MOVE#*,}

          DX=$((X-6))
          DY=$((Y-7))

          [ $DX -lt 0 ] && DX=$((-DX))
          [ $DY -lt 0 ] && DY=$((-DY))

          DIST=$DX

          if [ $DY -gt $DIST ]; then
            DIST=$DY
          fi

          if [ $DIST -le 3 ]; then
            echo "ERROR: engine X2 is inside radius 3: $MOVE"
            exit 1
          fi

          echo "PASS: X1 / O1 / X2 / X3 opening rules"
      - name: Test wall Zobrist hash
        shell: bash
        run: |
          set -euo pipefail

          ENGINE="./Rapfi/build/pbrain-rapfi"

          # Position A
          cat > /tmp/hash-a.txt <<'EOF'
          START 15
          YXBOARD
          7,7,3
          3,3,3
          10,10,3
          6,7,1
          8,8,2
          DONE
          TRACEBOARD
          END
          EOF

          "$ENGINE" < /tmp/hash-a.txt > /tmp/hash-a-output.txt 2>&1

          # Position B:
          # same stones, but one WALL moved
          cat > /tmp/hash-b.txt <<'EOF'
          START 15
          YXBOARD
          7,8,3
          3,3,3
          10,10,3
          6,7,1
          8,8,2
          DONE
          TRACEBOARD
          END
          EOF

          "$ENGINE" < /tmp/hash-b.txt > /tmp/hash-b-output.txt 2>&1

          # Position C:
          # same WALL layout as A, but different input order
          cat > /tmp/hash-c.txt <<'EOF'
          START 15
          YXBOARD
          10,10,3
          7,7,3
          3,3,3
          6,7,1
          8,8,2
          DONE
          TRACEBOARD
          END
          EOF

          "$ENGINE" < /tmp/hash-c.txt > /tmp/hash-c-output.txt 2>&1

          HASH_A=$(grep "Hash:" /tmp/hash-a-output.txt | tail -1 | awk '{print $NF}' || true)
          HASH_B=$(grep "Hash:" /tmp/hash-b-output.txt | tail -1 | awk '{print $NF}' || true)
          HASH_C=$(grep "Hash:" /tmp/hash-c-output.txt | tail -1 | awk '{print $NF}' || true)

          echo "Hash A: $HASH_A"
          echo "Hash B: $HASH_B"
          echo "Hash C: $HASH_C"

          if [ -z "$HASH_A" ] || [ -z "$HASH_B" ] || [ -z "$HASH_C" ]; then
            echo "ERROR: Could not read one or more hashes"
            exit 1
          fi

          if [ "$HASH_A" = "$HASH_B" ]; then
            echo "ERROR: Different WALL layouts produced the same board hash"
            exit 1
          fi

          if [ "$HASH_A" != "$HASH_C" ]; then
            echo "ERROR: Same WALL layout in different order produced different hashes"
            exit 1
          fi

          echo "PASS: WALL layout affects Zobrist hash"
          echo "PASS: WALL hash is independent of input order"
      